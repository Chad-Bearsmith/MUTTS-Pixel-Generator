name: Deploy public playtest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-player
      - name: Stage playable web assets
        run: |
          mkdir public
          cp -R game/Build game/TemplateData public/
          cp game/index.html game/offline-ui.js game/mutts-static-idle.js \
            game/mutts-sprite-atlas.js game/mutts-randomize.js game/mutts-static-idle.css public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT"
          for attempt in {1..8}; do
            if [[ "$(gh api "$endpoint" --jq '.total_count')" == 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available for $PAGES_ARTIFACT"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
